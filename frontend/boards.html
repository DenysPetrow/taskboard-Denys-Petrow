<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<title>TaskBoard – tablice</title>
</head>
<body>
<nav class="navbar navbar-dark tb-nav">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-bold" href="boards.html">TaskBoard</a>
    <div class="d-flex align-items-center gap-2">
      <span class="nav-user">Zalogowano: <strong id="userName"></strong></span>
      <button id="logoutBtn" type="button" class="btn btn-outline-light btn-sm">Wyloguj</button>
    </div>
  </div>
</nav>
<main class="container-fluid px-3 py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="page-title h2 mb-0">Tablice</h1>
    <button id="newBoardBtn" type="button" class="btn btn-primary">Nowa tablica</button>
  </div>
  <div class="row g-3" id="boards"></div>
</main>
<div class="modal fade" id="boardModal" tabindex="-1" aria-labelledby="boardModalTitle" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="boardForm" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="boardModalTitle">Tablica</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="boardName">Nazwa</label>
          <input class="form-control" id="boardName" maxlength="80">
          <div class="invalid-feedback">Nazwa musi mieć od 1 do 80 znaków</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="boardDesc">Opis (opcjonalnie)</label>
          <textarea class="form-control" id="boardDesc" rows="3" maxlength="255"></textarea>
        </div>
        <div class="text-danger small" id="boardFormError"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button>
        <button type="submit" class="btn btn-primary">Zapisz tablicę</button>
      </div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/boards.js"></script>
</body>
</html>
