<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<title>TaskBoard – logowanie</title>
</head>
<body>
<main class="container auth-box py-5">
  <h1 class="text-center brand">TaskBoard</h1>
  <p class="text-center text-secondary">Zadania zespołu w jednym miejscu</p>
  <div id="message"></div>
  <div class="card shadow-sm">
    <div class="card-header bg-white pb-0">
      <ul class="nav nav-tabs card-header-tabs" role="tablist">
        <li class="nav-item" role="presentation"><button class="nav-link active" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#tab-login">Logowanie</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#tab-register">Rejestracja</button></li>
      </ul>
    </div>
    <div class="card-body tab-content">
      <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="login">Login</label>
            <input class="form-control" id="login" autocomplete="username">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Hasło</label>
            <input class="form-control" id="password" type="password" autocomplete="current-password">
            <div class="invalid-feedback"></div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Zaloguj się</button>
        </form>
      </div>
      <div class="tab-pane fade" id="tab-register" role="tabpanel">
        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="regLogin">Login</label>
            <input class="form-control" id="regLogin" autocomplete="username">
            <div class="invalid-feedback"></div>
            <div class="form-text">3–30 znaków: litery, cyfry, kropka, myślnik lub podkreślnik.</div>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="regFirst">Imię</label>
              <input class="form-control" id="regFirst" autocomplete="given-name">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label" for="regLast">Nazwisko</label>
              <input class="form-control" id="regLast" autocomplete="family-name">
              <div class="invalid-feedback"></div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="regPassword">Hasło</label>
            <input class="form-control" id="regPassword" type="password" autocomplete="new-password">
            <div class="invalid-feedback"></div>
            <div class="form-text">Co najmniej 8 znaków.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="regPassword2">Powtórz hasło</label>
            <input class="form-control" id="regPassword2" type="password" autocomplete="new-password">
            <div class="invalid-feedback"></div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Utwórz konto</button>
        </form>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
